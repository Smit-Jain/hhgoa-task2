<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice RAG | HH Goa 2026</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">HH GOA | 2026</div>
            <div class="subtitle">Voice-Enabled RAG Pipeline</div>
        </header>

        <main>
            <div class="mic-container">
                <button id="mic-btn" class="mic-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <div id="status-text">Hold to speak (or click to toggle)</div>
            </div>

            <div id="output-section" class="hidden">
                <div class="result-card">
                    <h3>Transcription</h3>
                    <p id="transcription-text"></p>
                </div>
                <div class="result-card highlight">
                    <h3>Generated Answer</h3>
                    <p id="answer-text"></p>
                </div>
                <div class="metrics">
                    <span id="latency-metric"></span>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
